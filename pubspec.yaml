name: edu_bridge
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.1.0
  url_launcher: ^6.1.11
  timeago: ^3.3.0


  # 🚀 Firebase Packages (LATEST & COMPATIBLE)
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0

  # 📄 File Picker for uploading assignments
  file_picker: ^6.1.1

  # PDF Viewer for notes
  syncfusion_flutter_pdfviewer: ^31.1.19
  syncfusion_pdfviewer_web: ^31.1.19

  # For downloading PDF files
  http: ^1.2.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/img1.png
